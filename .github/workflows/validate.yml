name: Validate Santa monitor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile monitor.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install browser for diagnostic scan
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Dry-run full Nov-Dec booking date scan (no push)
        run: python monitor.py --mode dry-run
      - name: Save dry-run diagnostics if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chadstone-dry-run-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 1
